<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#2D3A2E">小屋</text><text x="596" y="43" class="ui body" font-weight="700" fill="#2D3A2E">旅行册</text><text x="700" y="43" class="ui body" font-weight="700" fill="#5B7F3B">地图</text><rect x="694" y="64" width="52" height="4" rx="2" fill="#5B7F3B"/><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="120" class="ui small" fill="#8B8170">← 返回世界地图</text><g transform="translate(72 154)"><rect width="1296" height="706" rx="30" fill="#FFF9ED" stroke="#D9CDBA"/><g transform="translate(28 28)"><rect width="690" height="330" rx="16" fill="#CFE4E8"/><path d="M0 257.40000000000003L138.0 118.8L248.39999999999998 217.8L386.40000000000003 79.2L524.4 224.4L690 132.0V330H0Z" fill="#6D8179"/><path d="M0 247.5Q172.5 211.20000000000002 345.0 247.5T690 237.6V330H0Z" fill="#99B080"/></g><text x="28" y="404" class="serif title">冰岛 · 雷尼斯黑沙滩</text><text x="28" y="436" class="ui small" fill="#8B8170">Vík, Iceland · 已到访 2 次</text><text x="28" y="488" class="ui h2">小满记得的事情</text><text x="28" y="524" class="serif body">风特别大。海是深蓝色。石头摸起来很凉。</text><text x="28" y="564" class="ui h2">真实世界小知识</text><text x="28" y="598" class="ui body">黑沙来自火山岩。这里常见玄武岩海蚀柱和强烈海风。</text><text x="28" y="626" class="ui small" fill="#8B8170">真实事实与角色日记分区展示，避免混淆。</text><g transform="translate(760 28)"><text class="ui h2">这个地点的收藏</text><text y="38" class="ui small" fill="#8B8170">明信片 3 / 4 · 纪念品 2 / 4</text><g transform="translate(0 72)"><rect width="240" height="160" rx="16" fill="#CFE4E8"/><path d="M0 124.80000000000001L48.0 57.599999999999994L86.39999999999999 105.60000000000001L134.4 38.4L182.4 108.80000000000001L240 64.0V160H0Z" fill="#6D8179"/><path d="M0 120.0Q60.0 102.4 120.0 120.0T240 115.19999999999999V160H0Z" fill="#99B080"/></g><g transform="translate(256 72)"><rect width="240" height="160" rx="16" fill="#CFE4E8"/><rect y="92.8" width="240" height="67.2" fill="#8DB7C0"/><path d="M0 100.8L43.199999999999996 54.400000000000006L81.60000000000001 97.6L124.80000000000001 43.2L168.0 96.0L240 62.400000000000006V160H0Z" fill="#708B79"/></g><rect x="0" y="260" width="240" height="100" rx="18" fill="#F4EDDF"/><text x="28" y="318" font-size="32">●</text><text x="76" y="305" class="ui body" font-weight="700">黑沙石</text><text x="76" y="330" class="ui small" fill="#8B8170">已获得</text><rect x="256" y="260" width="240" height="100" rx="18" fill="#F4EDDF"/><text x="284" y="318" font-size="32">🪶</text><text x="332" y="305" class="ui body" font-weight="700">海鸟羽毛</text><text x="332" y="330" class="ui small" fill="#8B8170">已获得</text><rect x="0" y="386" width="496" height="184" rx="20" fill="#EFF1E0"/><text x="24" y="422" class="ui h2">再次旅行会怎样？</text><text x="24" y="458" class="serif body">也许会遇到不同的天气、季节和同行者。</text><text x="24" y="492" class="ui small" fill="#8B8170">重复地点不会作废，而是解锁内容变体。</text><g><rect x="24" y="520" width="190" height="52" rx="18" fill="#FFF9ED" stroke="#D9CDBA"/><text x="119.0" y="553" class="ui body" text-anchor="middle" fill="#2D3A2E" font-weight="700">查看全部收藏</text></g></g></g></svg>