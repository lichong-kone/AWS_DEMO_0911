<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#2D3A2E">小屋</text><text x="596" y="43" class="ui body" font-weight="700" fill="#2D3A2E">旅行册</text><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="132" class="serif title">先认识你的旅行伙伴</text><text x="72" y="166" class="ui body" fill="#8B8170">角色只影响陪伴感与动画，不影响旅行强度。</text><g transform="translate(72 210)" filter="url(#shadow)"><rect width="360" height="430" rx="28" fill="#FFF9ED" stroke="#5B7F3B" stroke-width="3"/><circle cx="180" cy="160" r="112" fill="#EEF0DF"/><g id="pick-frog" transform="translate(116 88) scale(1)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/></g><text x="180" y="315" text-anchor="middle" class="ui h2">小青蛙</text><text x="180" y="345" text-anchor="middle" class="ui small" fill="#8B8170">喜欢风和远方</text><rect x="118" y="372" width="124" height="36" rx="18" fill="#E0E9CD"/><text x="180" y="396" text-anchor="middle" class="ui small" fill="#5B7F3B">已选择</text></g><g transform="translate(482 210)" filter="url(#shadow)"><rect width="360" height="430" rx="28" fill="#FFF9ED" stroke="#D9CDBA" stroke-width="1"/><circle cx="180" cy="160" r="112" fill="#EEF0DF"/><g transform="translate(118 90) scale(1)"><ellipse cx="64" cy="128" rx="42" ry="10" fill="#2D3A2E" opacity=".12"/><ellipse cx="64" cy="85" rx="47" ry="49" fill="#A87554" stroke="#6E4C38" stroke-width="4"/><ellipse cx="64" cy="96" rx="31" ry="30" fill="#E9D5B9"/><circle cx="43" cy="57" r="7" fill="#2D3A2E"/><circle cx="86" cy="57" r="7" fill="#2D3A2E"/><circle cx="64" cy="75" r="6" fill="#453127"/><path d="M52 86Q64 95 76 86" fill="none" stroke="#5F4332" stroke-width="3"/><path d="M26 73L7 66M26 82L5 82M102 73L122 66M102 82L124 82" stroke="#6E4C38" stroke-width="2"/></g><text x="180" y="315" text-anchor="middle" class="ui h2">小水獭</text><text x="180" y="345" text-anchor="middle" class="ui small" fill="#8B8170">喜欢河流和小吃</text><rect x="118" y="372" width="124" height="36" rx="18" fill="#F5EEE0"/><text x="180" y="396" text-anchor="middle" class="ui small" fill="#2D3A2E">选择它</text></g><g transform="translate(892 210)" filter="url(#shadow)"><rect width="360" height="430" rx="28" fill="#FFF9ED" stroke="#D9CDBA" stroke-width="1"/><circle cx="180" cy="160" r="112" fill="#EEF0DF"/><g transform="translate(118 90) scale(1)"><ellipse cx="64" cy="128" rx="42" ry="10" fill="#2D3A2E" opacity=".12"/><path d="M18 92Q15 41 64 27Q113 41 110 94Q88 126 64 128Q38 126 18 92Z" fill="#8A6C53" stroke="#5A4636" stroke-width="4"/><path d="M34 88Q34 56 64 49Q94 56 94 88Q84 112 64 115Q44 112 34 88Z" fill="#ECD9BE"/><circle cx="51" cy="71" r="5" fill="#2D3A2E"/><circle cx="78" cy="71" r="5" fill="#2D3A2E"/><circle cx="64" cy="84" r="5" fill="#4B382F"/></g><text x="180" y="315" text-anchor="middle" class="ui h2">小刺猬</text><text x="180" y="345" text-anchor="middle" class="ui small" fill="#8B8170">喜欢山路和安静</text><rect x="118" y="372" width="124" height="36" rx="18" fill="#F5EEE0"/><text x="180" y="396" text-anchor="middle" class="ui small" fill="#2D3A2E">选择它</text></g><g transform="translate(72 690)"><text class="ui h2">给它起个名字</text><rect x="0" y="28" width="430" height="54" rx="16" fill="#FFF9ED" stroke="#D9CDBA"/><text x="18" y="62" class="ui body">小满</text><g><rect x="470" y="28" width="180" height="52" rx="18" fill="#5B7F3B" stroke="none"/><text x="560.0" y="61" class="ui body" text-anchor="middle" fill="#FFF9ED" font-weight="700">进入小屋</text></g></g></svg>