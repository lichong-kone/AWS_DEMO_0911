<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#2D3A2E">小屋</text><text x="596" y="43" class="ui body" font-weight="700" fill="#2D3A2E">旅行册</text><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#5B7F3B">商店</text><rect x="780" y="64" width="52" height="4" rx="2" fill="#5B7F3B"/><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="132" class="serif title">小小商店</text><text x="72" y="166" class="ui body" fill="#8B8170">给旅行多一点可能，但不卖“立即回来”。</text><rect x="1130" y="116" width="238" height="58" rx="20" fill="#FFF9ED" stroke="#D9CDBA"/><text x="1160" y="151" class="ui h2">☘ 328</text><text x="1262" y="151" class="ui small" fill="#8B8170">可用</text><g transform="translate(72 210)"><rect width="1296" height="650" rx="28" fill="#FFF9ED" stroke="#D9CDBA"/><g id="shop-tabs"><rect x="24" y="24" width="104" height="40" rx="20" fill="#E0E9CD"/><text x="53" y="49" class="ui body" fill="#5B7F3B">食物</text><text x="160" y="49" class="ui body">护符</text><text x="250" y="49" class="ui body">装备</text><text x="340" y="49" class="ui body">装饰</text></g><g transform="translate(26 96)"><rect width="252" height="204" rx="22" fill="#F6EEE0"/><text x="126" y="74" text-anchor="middle" font-size="46">🥖</text><text x="20" y="122" class="ui h2">果酱面包</text><text x="20" y="150" class="ui small" fill="#8B8170">轻巧，适合短途</text><text x="20" y="183" class="ui body" fill="#5B7F3B">☘ 12</text><rect x="172" y="160" width="60" height="30" rx="15" fill="#E0E9CD"/><text x="202" y="180" class="ui small" text-anchor="middle" fill="#5B7F3B">购买</text></g><g transform="translate(302 96)"><rect width="252" height="204" rx="22" fill="#F6EEE0"/><text x="126" y="74" text-anchor="middle" font-size="46">🍙</text><text x="20" y="122" class="ui h2">饭团</text><text x="20" y="150" class="ui small" fill="#8B8170">耐饿，适合走远一点</text><text x="20" y="183" class="ui body" fill="#5B7F3B">☘ 16</text><rect x="172" y="160" width="60" height="30" rx="15" fill="#E0E9CD"/><text x="202" y="180" class="ui small" text-anchor="middle" fill="#5B7F3B">购买</text></g><g transform="translate(578 96)"><rect width="252" height="204" rx="22" fill="#F6EEE0"/><text x="126" y="74" text-anchor="middle" font-size="46">🥧</text><text x="20" y="122" class="ui h2">莓果挞</text><text x="20" y="150" class="ui small" fill="#8B8170">甜甜的，也许会遇见朋友</text><text x="20" y="183" class="ui body" fill="#5B7F3B">☘ 24</text><rect x="172" y="160" width="60" height="30" rx="15" fill="#E0E9CD"/><text x="202" y="180" class="ui small" text-anchor="middle" fill="#5B7F3B">购买</text></g><g transform="translate(26 326)"><rect width="252" height="204" rx="22" fill="#F6EEE0"/><text x="126" y="74" text-anchor="middle" font-size="46">🥜</text><text x="20" y="122" class="ui h2">干果包</text><text x="20" y="150" class="ui small" fill="#8B8170">适合山路</text><text x="20" y="183" class="ui body" fill="#5B7F3B">☘ 18</text><rect x="172" y="160" width="60" height="30" rx="15" fill="#E0E9CD"/><text x="202" y="180" class="ui small" text-anchor="middle" fill="#5B7F3B">购买</text></g><g transform="translate(302 326)"><rect width="252" height="204" rx="22" fill="#F6EEE0"/><text x="126" y="74" text-anchor="middle" font-size="46">🍲</text><text x="20" y="122" class="ui h2">蘑菇汤</text><text x="20" y="150" class="ui small" fill="#8B8170">适合凉爽天气</text><text x="20" y="183" class="ui body" fill="#5B7F3B">☘ 20</text><rect x="172" y="160" width="60" height="30" rx="15" fill="#E0E9CD"/><text x="202" y="180" class="ui small" text-anchor="middle" fill="#5B7F3B">购买</text></g><g transform="translate(578 326)"><rect width="252" height="204" rx="22" fill="#F6EEE0"/><text x="126" y="74" text-anchor="middle" font-size="46">🍱</text><text x="20" y="122" class="ui h2">野餐盒</text><text x="20" y="150" class="ui small" fill="#8B8170">适合停留更久</text><text x="20" y="183" class="ui body" fill="#5B7F3B">☘ 28</text><rect x="172" y="160" width="60" height="30" rx="15" fill="#E0E9CD"/><text x="202" y="180" class="ui small" text-anchor="middle" fill="#5B7F3B">购买</text></g><g transform="translate(865 96)"><text class="ui h2">商品说明</text><rect y="24" width="380" height="436" rx="24" fill="#F3E9D8"/><g id="shop-frog" transform="translate(126 68) scale(1.1)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/></g><text x="28" y="265" class="serif h2">“吃饱了才有力气走远呀。”</text><text x="28" y="310" class="ui small" fill="#8B8170">食物主要影响旅行时长和区域倾向。</text><text x="28" y="340" class="ui small" fill="#8B8170">商店不会显示精确目的地概率。</text><path d="M28 370H352" stroke="#D9CDBA"/><text x="28" y="410" class="ui body">今日推荐</text><text x="28" y="438" class="serif body">莓果挞 · 也许更容易遇到新朋友</text></g></g></svg>