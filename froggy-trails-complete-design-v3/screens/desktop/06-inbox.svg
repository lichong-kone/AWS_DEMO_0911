<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#2D3A2E">小屋</text><text x="596" y="43" class="ui body" font-weight="700" fill="#5B7F3B">旅行册</text><rect x="590" y="64" width="66" height="4" rx="2" fill="#5B7F3B"/><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="132" class="serif title">来信</text><text x="72" y="166" class="ui body" fill="#8B8170">每一封信都只是旅途中的一个小片段。</text><g transform="translate(72 210)"><rect width="470" height="650" rx="26" fill="#FFF9ED" stroke="#D9CDBA"/><text x="24" y="40" class="ui h2">全部来信</text><rect x="330" y="18" width="114" height="36" rx="18" fill="#E0E9CD"/><text x="387" y="41" text-anchor="middle" class="ui small" fill="#5B7F3B">未读 2 封</text><g><rect x="18" y="82" width="434" height="112" rx="18" fill="#F2F3E3"/><g transform="translate(32 98)"><rect width="110" height="80" rx="16" fill="#CFE4E8"/><path d="M0 62.400000000000006L22.0 28.799999999999997L39.6 52.800000000000004L61.60000000000001 19.2L83.6 54.400000000000006L110 32.0V80H0Z" fill="#6D8179"/><path d="M0 60.0Q27.5 51.2 55.0 60.0T110 57.599999999999994V80H0Z" fill="#99B080"/></g><text x="158" y="118" class="ui h2">风很大的地方</text><text x="158" y="144" class="ui small" fill="#8B8170">今天 14:22</text><text x="158" y="170" class="serif small">“今天看见了一点不一样的风景。”</text><circle cx="428" cy="106" r="5" fill="#C96F4A"/></g><g><rect x="18" y="214" width="434" height="112" rx="18" fill="#F2F3E3"/><g transform="translate(32 230)"><rect width="110" height="80" rx="16" fill="#CFE4E8"/><rect y="46.4" width="110" height="33.6" fill="#8DB7C0"/><path d="M0 50.4L19.8 27.200000000000003L37.400000000000006 48.8L57.2 21.6L77.0 48.0L110 31.200000000000003V80H0Z" fill="#708B79"/></g><text x="158" y="250" class="ui h2">圣托里尼</text><text x="158" y="276" class="ui small" fill="#8B8170">昨天 18:05</text><text x="158" y="302" class="serif small">“今天看见了一点不一样的风景。”</text><circle cx="428" cy="238" r="5" fill="#C96F4A"/></g><g><rect x="18" y="346" width="434" height="112" rx="18" fill="#F8F1E5"/><g transform="translate(32 362)"><rect width="110" height="80" rx="16" fill="#CFE4E8"/><path d="M0 62.400000000000006L22.0 28.799999999999997L39.6 52.800000000000004L61.60000000000001 19.2L83.6 54.400000000000006L110 32.0V80H0Z" fill="#6D8179"/><path d="M0 60.0Q27.5 51.2 55.0 60.0T110 57.599999999999994V80H0Z" fill="#99B080"/></g><text x="158" y="382" class="ui h2">冰岛 · 黑沙滩</text><text x="158" y="408" class="ui small" fill="#8B8170">09.05</text><text x="158" y="434" class="serif small">“今天看见了一点不一样的风景。”</text></g><g><rect x="18" y="478" width="434" height="112" rx="18" fill="#F8F1E5"/><g transform="translate(32 494)"><rect width="110" height="80" rx="16" fill="#CFE4E8"/><rect y="54.400000000000006" width="110" height="25.6" fill="#97BAC4"/><g fill="#EFE5D3"><rect x="8.8" y="24.0" width="16.5" height="30.4"/><rect x="30.800000000000004" y="17.6" width="19.8" height="36.800000000000004"/><rect x="57.2" y="27.200000000000003" width="17.6" height="27.200000000000003"/><rect x="80.3" y="14.399999999999999" width="19.8" height="40.0"/></g></g><text x="158" y="514" class="ui h2">京都 · 山门</text><text x="158" y="540" class="ui small" fill="#8B8170">08.31</text><text x="158" y="566" class="serif small">“今天看见了一点不一样的风景。”</text></g></g><g transform="translate(570 210)"><rect width="798" height="650" rx="26" fill="url(#paperGrad)" stroke="#D9CDBA"/><text x="34" y="48" class="ui small" fill="#8B8170">今天 14:22</text><text x="34" y="86" class="serif title">风很大的地方</text><g transform="translate(34 120)"><rect width="730" height="360" rx="16" fill="#CFE4E8"/><path d="M0 280.8L146.0 129.6L262.8 237.60000000000002L408.8 86.39999999999999L554.8 244.8L730 144.0V360H0Z" fill="#6D8179"/><path d="M0 270.0Q182.5 230.4 365.0 270.0T730 259.2V360H0Z" fill="#99B080"/></g><g id="mail-frog" transform="translate(548 335) scale(0.65)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/><rect x="75" y="94" width="44" height="30" rx="4" fill="#F5E9CF" stroke="#8A755C" stroke-width="2"/><path d="M77 97L97 111L117 97" fill="none" stroke="#8A755C" stroke-width="2"/></g><text x="34" y="530" class="serif h2">“我找到了一块很适合坐着发呆的石头。”</text><text x="34" y="566" class="ui small" fill="#8B8170">地点暂时未知。等小满回来后再揭晓。</text><g><rect x="34" y="586" width="190" height="52" rx="18" fill="#5B7F3B" stroke="none"/><text x="129.0" y="619" class="ui body" text-anchor="middle" fill="#FFF9ED" font-weight="700">收藏这封信</text></g><g><rect x="240" y="586" width="150" height="52" rx="18" fill="#FFF9ED" stroke="#D9CDBA"/><text x="315.0" y="619" class="ui body" text-anchor="middle" fill="#2D3A2E" font-weight="700">分享</text></g></g></svg>