<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<defs>
  <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9ED"/><stop offset="1" stop-color="#F0E4CF"/></linearGradient>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D8EEF1"/><stop offset="1" stop-color="#9FC8CF"/></linearGradient>
  <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B1D4D9"/><stop offset="1" stop-color="#6F9EAA"/></linearGradient>
  <pattern id="woodPattern" width="160" height="40" patternUnits="userSpaceOnUse"><rect width="160" height="40" fill="#654933"/><path d="M0 10 C40 3 72 16 160 8 M0 28 C48 19 98 34 160 26" stroke="#7A5941" stroke-width="2" opacity=".5" fill="none"/><path d="M22 0 C32 13 24 25 37 40 M112 0 C100 14 116 25 106 40" stroke="#463528" opacity=".35" fill="none"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D3A2E" flood-opacity=".13"/></filter>
  <filter id="shadowStrong" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#241A14" flood-opacity=".23"/></filter>
</defs>

<style>
.ui{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2D3A2E}
.serif{font-family:Georgia,"Songti SC","STSong",serif;fill:#2D3A2E}
.tiny{font-size:12px} .small{font-size:14px} .body{font-size:16px} .h2{font-size:20px;font-weight:700} .title{font-size:28px;font-weight:700} .hero{font-size:38px;font-weight:700}
</style>
<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#2D3A2E">小屋</text><text x="596" y="43" class="ui body" font-weight="700" fill="#5B7F3B">旅行册</text><rect x="590" y="64" width="66" height="4" rx="2" fill="#5B7F3B"/><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="132" class="serif title">旅行印章</text><text x="72" y="166" class="ui body" fill="#8B8170">成就不催促打卡，只记录那些自然发生的旅程。</text><g transform="translate(72 210)"><rect width="1296" height="650" rx="28" fill="#FFF9ED" stroke="#D9CDBA"/><text x="28" y="48" class="ui h2">已获得 8 / 24</text><g opacity="1"><rect x="28" y="84" width="278" height="220" rx="22" fill="#EFF1E0"/><circle cx="167" cy="160" r="48" fill="#FFF9ED" stroke="#C5A85A" stroke-width="3"/><text x="167" y="174" text-anchor="middle" font-size="38">↗</text><text x="167" y="229" text-anchor="middle" class="ui h2">第一次出发</text><text x="167" y="258" text-anchor="middle" class="ui small" fill="#8B8170">完成第一趟旅行</text><text x="167" y="284" text-anchor="middle" class="ui tiny" fill="#5B7F3B">已获得</text></g><g opacity="1"><rect x="330" y="84" width="278" height="220" rx="22" fill="#EFF1E0"/><circle cx="469" cy="160" r="48" fill="#FFF9ED" stroke="#C5A85A" stroke-width="3"/><text x="469" y="174" text-anchor="middle" font-size="38">✉</text><text x="469" y="229" text-anchor="middle" class="ui h2">远方来信</text><text x="469" y="258" text-anchor="middle" class="ui small" fill="#8B8170">收到第一张明信片</text><text x="469" y="284" text-anchor="middle" class="ui tiny" fill="#5B7F3B">已获得</text></g><g opacity="1"><rect x="632" y="84" width="278" height="220" rx="22" fill="#EFF1E0"/><circle cx="771" cy="160" r="48" fill="#FFF9ED" stroke="#C5A85A" stroke-width="3"/><text x="771" y="174" text-anchor="middle" font-size="38">⌖</text><text x="771" y="229" text-anchor="middle" class="ui h2">世界一角</text><text x="771" y="258" text-anchor="middle" class="ui small" fill="#8B8170">点亮 10 个地点</text><text x="771" y="284" text-anchor="middle" class="ui tiny" fill="#5B7F3B">已获得</text></g><g opacity="1"><rect x="934" y="84" width="278" height="220" rx="22" fill="#EFF1E0"/><circle cx="1073" cy="160" r="48" fill="#FFF9ED" stroke="#C5A85A" stroke-width="3"/><text x="1073" y="174" text-anchor="middle" font-size="38">☂</text><text x="1073" y="229" text-anchor="middle" class="ui h2">雨天也出门</text><text x="1073" y="258" text-anchor="middle" class="ui small" fill="#8B8170">经历 3 次雨天旅行</text><text x="1073" y="284" text-anchor="middle" class="ui tiny" fill="#5B7F3B">已获得</text></g><g opacity="1"><rect x="28" y="334" width="278" height="220" rx="22" fill="#EFF1E0"/><circle cx="167" cy="410" r="48" fill="#FFF9ED" stroke="#C5A85A" stroke-width="3"/><text x="167" y="424" text-anchor="middle" font-size="38">☆</text><text x="167" y="479" text-anchor="middle" class="ui h2">收藏家</text><text x="167" y="508" text-anchor="middle" class="ui small" fill="#8B8170">获得 20 个纪念品</text><text x="167" y="534" text-anchor="middle" class="ui tiny" fill="#5B7F3B">已获得</text></g><g opacity="1"><rect x="330" y="334" width="278" height="220" rx="22" fill="#EFF1E0"/><circle cx="469" cy="410" r="48" fill="#FFF9ED" stroke="#C5A85A" stroke-width="3"/><text x="469" y="424" text-anchor="middle" font-size="38">✦</text><text x="469" y="479" text-anchor="middle" class="ui h2">极光之夜</text><text x="469" y="508" text-anchor="middle" class="ui small" fill="#8B8170">收到极光明信片</text><text x="469" y="534" text-anchor="middle" class="ui tiny" fill="#5B7F3B">已获得</text></g><g opacity=".55"><rect x="632" y="334" width="278" height="220" rx="22" fill="#F3EFE8"/><circle cx="771" cy="410" r="48" fill="#FFF9ED" stroke="#D9CDBA" stroke-width="3"/><text x="771" y="424" text-anchor="middle" font-size="38">▭</text><text x="771" y="479" text-anchor="middle" class="ui h2">铁路旅人</text><text x="771" y="508" text-anchor="middle" class="ui small" fill="#8B8170">完成秋日铁路专题</text><text x="771" y="534" text-anchor="middle" class="ui tiny" fill="#8B8170">还没发生</text></g><g opacity=".55"><rect x="934" y="334" width="278" height="220" rx="22" fill="#F3EFE8"/><circle cx="1073" cy="410" r="48" fill="#FFF9ED" stroke="#D9CDBA" stroke-width="3"/><text x="1073" y="424" text-anchor="middle" font-size="38">◌</text><text x="1073" y="479" text-anchor="middle" class="ui h2">世界很大</text><text x="1073" y="508" text-anchor="middle" class="ui small" fill="#8B8170">点亮 50 个地点</text><text x="1073" y="534" text-anchor="middle" class="ui tiny" fill="#8B8170">还没发生</text></g></g></svg>