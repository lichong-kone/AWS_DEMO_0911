<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#5B7F3B">小屋</text><rect x="494" y="64" width="52" height="4" rx="2" fill="#5B7F3B"/><text x="596" y="43" class="ui body" font-weight="700" fill="#2D3A2E">旅行册</text><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="132" class="serif title">小满正在旅行</text><text x="72" y="166" class="ui body" fill="#8B8170">不知道它去了哪里。只知道今天的风有点凉。</text><g transform="translate(72 210)" filter="url(#shadow)"><rect width="860" height="620" rx="30" fill="url(#skyGrad)"/><path d="M0 348Q160 286 310 324T610 298T860 320V620H0Z" fill="#89A982"/><path d="M0 430Q210 390 420 420T860 386V620H0Z" fill="#A9B487"/><path d="M160 470C300 405 535 400 730 454" fill="none" stroke="#C96F4A" stroke-width="4" stroke-dasharray="10 10"/><g id="travel-frog" transform="translate(372 380) scale(1.25)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/><path d="M16 102Q2 119 0 136M107 99Q126 115 128 133" stroke="#4E7138" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M124 84L139 136" stroke="#7D5D3F" stroke-width="4"/></g><g transform="translate(74 70)"><rect width="300" height="110" rx="22" fill="#FFF9ED" opacity=".9"/><text x="24" y="38" class="ui small" fill="#8B8170">今天的旅行迹象</text><text x="24" y="70" class="serif h2">风很大 · 路有点长 · 没有下雨</text><text x="24" y="94" class="ui small" fill="#5B7F3B">不展示实时位置</text></g></g><g transform="translate(970 210)"><rect width="398" height="620" rx="28" fill="url(#paperGrad)" stroke="#D9CDBA"/><text x="28" y="48" class="ui h2">旅途中</text><text x="28" y="82" class="serif body">“我好像走到了一个很高的地方。”</text><rect x="28" y="120" width="342" height="90" rx="18" fill="#EFF0DF"/><text x="50" y="151" class="ui small" fill="#8B8170">出发时间</text><text x="50" y="180" class="ui h2">今天 09:24</text><text x="230" y="151" class="ui small" fill="#8B8170">预计状态</text><text x="230" y="180" class="ui body">仍在远行</text><text x="28" y="260" class="ui h2">最近一次来信</text><g transform="translate(28 286)"><rect width="342" height="190" rx="16" fill="#CFE4E8"/><path d="M0 148.20000000000002L68.4 68.39999999999999L123.11999999999999 125.4L191.52 45.6L259.92 129.20000000000002L342 76.0V190H0Z" fill="#6D8179"/><path d="M0 142.5Q85.5 121.60000000000001 171.0 142.5T342 136.79999999999998V190H0Z" fill="#99B080"/></g><text x="28" y="506" class="ui h2">你可以做什么？</text><text x="28" y="538" class="ui body">• 看旧明信片</text><text x="28" y="568" class="ui body">• 整理收藏</text><text x="28" y="598" class="ui body">• 等它自己回来</text></g></svg>