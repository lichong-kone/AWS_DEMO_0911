<rect width="1440" height="960" fill="url(#woodPattern)"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#2D3A2E">小屋</text><text x="596" y="43" class="ui body" font-weight="700" fill="#5B7F3B">旅行册</text><rect x="590" y="64" width="66" height="4" rx="2" fill="#5B7F3B"/><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="48" y="110" class="ui small" fill="#F9EBD7">← 返回旅行册</text><g transform="translate(90 132)" filter="url(#shadowStrong)"><rect width="1260" height="720" rx="30" fill="#D3BD98"/><rect x="18" y="18" width="600" height="684" rx="24" fill="url(#paperGrad)"/><rect x="642" y="18" width="600" height="684" rx="24" fill="url(#paperGrad)"/><path d="M630 24C619 200 620 520 630 698" stroke="#8E7654" stroke-width="10" opacity=".25"/><g transform="translate(68 70)"><rect width="480" height="508" rx="8" fill="#F9F3E8" stroke="#D9CDBA"/><g transform="translate(24 24)"><rect width="432" height="388" rx="16" fill="#CFE4E8"/><path d="M0 302.64L86.4 139.68L155.51999999999998 256.08L241.92000000000002 93.11999999999999L328.32 263.84000000000003L432 155.20000000000002V388H0Z" fill="#6D8179"/><path d="M0 291.0Q108.0 248.32 216.0 291.0T432 279.36V388H0Z" fill="#99B080"/></g><g id="pc-frog" transform="translate(202 248) scale(0.86)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/><g transform="translate(88 88)"><rect width="34" height="42" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><rect x="5" y="14" width="24" height="15" rx="5" fill="#D79256"/></g><path d="M22 31Q63 10 103 31" fill="none" stroke="#C96F4A" stroke-width="5"/></g><text x="38" y="466" class="serif h2">世界很大，雨或正好有时间。</text><rect x="8" y="-10" width="96" height="28" rx="4" fill="#D8C38B" opacity=".75" transform="rotate(-10)"/></g><g transform="translate(688 74)"><text class="serif title">冰岛 · 黑沙滩</text><text y="34" class="serif small" fill="#9A896F">Iceland · Reynisfjara</text><g transform="translate(398 -12) rotate(8)"><circle cx="52" cy="52" r="46" fill="none" stroke="#9D8A70" stroke-width="2"/><text x="16" y="46" class="ui tiny" fill="#8C7A63">FROGGY TRAILS</text><text x="20" y="65" class="ui tiny" fill="#8C7A63">2026.09.05</text></g><text y="112" class="ui body">◷ 2026.09.02 — 09.05</text><text y="145" class="ui body">⌖ 维克 · 雷尼斯黑沙滩</text><text y="178" class="ui body">☁ 多云 · 3°C — 8°C</text><path d="M0 208H510" stroke="#D9CDBA"/><text y="250" class="ui h2">小满的日记</text><text y="288" class="serif body">站在黑色的沙滩上，海浪像在低声说话。</text><text y="318" class="serif body">风有点大，但我觉得好自由。</text><text y="384" class="ui h2">这次带回来的纪念品</text><rect y="408" width="242" height="108" rx="18" fill="#F4EDDF"/><text x="34" y="466" font-size="34">●</text><text x="88" y="452" class="ui body" font-weight="700">黑沙石</text><text x="88" y="478" class="ui small" fill="#8B8170">一块普通但很重的石头</text><rect x="260" y="408" width="242" height="108" rx="18" fill="#F4EDDF"/><text x="294" y="466" font-size="34">🪶</text><text x="348" y="452" class="ui body" font-weight="700">海鸟羽毛</text><text x="348" y="478" class="ui small" fill="#8B8170">被海风吹来的礼物</text><g><rect x="0" y="558" width="236" height="52" rx="18" fill="#5B7F3B" stroke="none"/><text x="118.0" y="591" class="ui body" text-anchor="middle" fill="#FFF9ED" font-weight="700">↓ 保存到旅行册</text></g><g><rect x="256" y="558" width="226" height="52" rx="18" fill="#FFF9ED" stroke="#D9CDBA"/><text x="369.0" y="591" class="ui body" text-anchor="middle" fill="#2D3A2E" font-weight="700">↗ 分享明信片</text></g></g></g></svg>