<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#5B7F3B">小屋</text><rect x="494" y="64" width="52" height="4" rx="2" fill="#5B7F3B"/><text x="596" y="43" class="ui body" font-weight="700" fill="#2D3A2E">旅行册</text><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><g transform="translate(160 126)" filter="url(#shadowStrong)"><rect width="1120" height="724" rx="30" fill="url(#paperGrad)"/><text x="56" y="72" class="serif title">小满回来了！</text><text x="56" y="106" class="ui body" fill="#8B8170">这次它去了冰岛，带回一张明信片和两件小东西。</text><g transform="translate(56 146)"><rect width="620" height="364" rx="16" fill="#CFE4E8"/><path d="M0 283.92L124.0 131.04L223.2 240.24L347.20000000000005 87.36L471.2 247.52L620 145.6V364H0Z" fill="#6D8179"/><path d="M0 273.0Q155.0 232.96 310.0 273.0T620 262.08V364H0Z" fill="#99B080"/></g><g id="return-frog" transform="translate(500 330) scale(0.9)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/><g transform="translate(88 88)"><rect width="34" height="42" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><rect x="5" y="14" width="24" height="15" rx="5" fill="#D79256"/></g><path d="M22 31Q63 10 103 31" fill="none" stroke="#C96F4A" stroke-width="5"/></g><g transform="translate(720 146)"><text class="ui h2">旅行摘要</text><text y="44" class="ui body">目的地：冰岛 · 黑沙滩</text><text y="78" class="ui body">旅行时长：2 天 8 小时</text><text y="112" class="ui body">天气：多云 · 大风</text><text y="146" class="ui body">明信片：1 张</text><text y="180" class="ui body">纪念品：2 件</text><path d="M0 214H320" stroke="#D9CDBA"/><text y="256" class="ui h2">新获得</text><rect y="282" width="150" height="110" rx="18" fill="#F4EDDF"/><text x="75" y="340" text-anchor="middle" font-size="34">●</text><text x="75" y="374" text-anchor="middle" class="ui small">黑沙石</text><rect x="170" y="282" width="150" height="110" rx="18" fill="#F4EDDF"/><text x="245" y="340" text-anchor="middle" font-size="34">🪶</text><text x="245" y="374" text-anchor="middle" class="ui small">海鸟羽毛</text></g><g><rect x="720" y="588" width="200" height="52" rx="18" fill="#5B7F3B" stroke="none"/><text x="820.0" y="621" class="ui body" text-anchor="middle" fill="#FFF9ED" font-weight="700">查看完整旅行</text></g><g><rect x="936" y="588" width="128" height="52" rx="18" fill="#FFF9ED" stroke="#D9CDBA"/><text x="1000.0" y="621" class="ui body" text-anchor="middle" fill="#2D3A2E" font-weight="700">回到小屋</text></g></g></svg>