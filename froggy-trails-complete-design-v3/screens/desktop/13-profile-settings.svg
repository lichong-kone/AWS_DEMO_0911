<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<defs>
  <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9ED"/><stop offset="1" stop-color="#F0E4CF"/></linearGradient>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D8EEF1"/><stop offset="1" stop-color="#9FC8CF"/></linearGradient>
  <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B1D4D9"/><stop offset="1" stop-color="#6F9EAA"/></linearGradient>
  <pattern id="woodPattern" width="160" height="40" patternUnits="userSpaceOnUse"><rect width="160" height="40" fill="#654933"/><path d="M0 10 C40 3 72 16 160 8 M0 28 C48 19 98 34 160 26" stroke="#7A5941" stroke-width="2" opacity=".5" fill="none"/><path d="M22 0 C32 13 24 25 37 40 M112 0 C100 14 116 25 106 40" stroke="#463528" opacity=".35" fill="none"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D3A2E" flood-opacity=".13"/></filter>
  <filter id="shadowStrong" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#241A14" flood-opacity=".23"/></filter>
</defs>

<style>
.ui{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2D3A2E}
.serif{font-family:Georgia,"Songti SC","STSong",serif;fill:#2D3A2E}
.tiny{font-size:12px} .small{font-size:14px} .body{font-size:16px} .h2{font-size:20px;font-weight:700} .title{font-size:28px;font-weight:700} .hero{font-size:38px;font-weight:700}
</style>
<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#2D3A2E">小屋</text><text x="596" y="43" class="ui body" font-weight="700" fill="#2D3A2E">旅行册</text><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="132" class="serif title">我的小蛙与设置</text><text x="72" y="166" class="ui body" fill="#8B8170">账号、通知、外观与数据都集中在这里。</text><g><rect x="72" y="210" width="430" height="650" rx="24" fill="url(#paperGrad)" stroke="#D9CDBA"/></g><g id="profile-frog" transform="translate(190 260) scale(1.4)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/><path d="M103 92Q125 77 128 54" stroke="#4E7138" stroke-width="8" stroke-linecap="round" fill="none"/></g><text x="287" y="500" text-anchor="middle" class="ui title">小满</text><text x="287" y="530" text-anchor="middle" class="ui small" fill="#8B8170">陪伴 48 天 · 去过 12 个地方</text><g><rect x="132" y="574" width="310" height="52" rx="18" fill="#FFF9ED" stroke="#D9CDBA"/><text x="287.0" y="607" class="ui body" text-anchor="middle" fill="#2D3A2E" font-weight="700">编辑名字与头像</text></g><text x="132" y="668" class="ui small" fill="#8B8170">当前存档：游客 + 本地备份</text><g><rect x="132" y="700" width="310" height="52" rx="18" fill="#5B7F3B" stroke="none"/><text x="287.0" y="733" class="ui body" text-anchor="middle" fill="#FFF9ED" font-weight="700">登录并同步旅行记录</text></g><g transform="translate(532 210)"><rect width="836" height="650" rx="28" fill="#FFF9ED" stroke="#D9CDBA"/><text x="28" y="48" class="ui h2">设置</text><g><text x="28" y="100" class="ui body" font-weight="700">通知</text><text x="28" y="126" class="ui small" fill="#8B8170">小蛙回来、收到明信片、朋友来访</text><rect x="690" y="82" width="112" height="38" rx="19" fill="#F3EDDF"/><text x="746" y="107" class="ui small" text-anchor="middle">已开启</text><path d="M28 146H808" stroke="#D9CDBA"/></g><g><text x="28" y="182" class="ui body" font-weight="700">外观</text><text x="28" y="208" class="ui small" fill="#8B8170">跟随系统 · 米白纸张主题</text><rect x="690" y="164" width="112" height="38" rx="19" fill="#F3EDDF"/><text x="746" y="189" class="ui small" text-anchor="middle">系统</text><path d="M28 228H808" stroke="#D9CDBA"/></g><g><text x="28" y="264" class="ui body" font-weight="700">旅行节奏</text><text x="28" y="290" class="ui small" fill="#8B8170">普通等待 · 不展示倒计时</text><rect x="690" y="246" width="112" height="38" rx="19" fill="#F3EDDF"/><text x="746" y="271" class="ui small" text-anchor="middle">推荐</text><path d="M28 310H808" stroke="#D9CDBA"/></g><g><text x="28" y="346" class="ui body" font-weight="700">数据与隐私</text><text x="28" y="372" class="ui small" fill="#8B8170">导出旅行记录 / 删除账号</text><rect x="690" y="328" width="112" height="38" rx="19" fill="#F3EDDF"/><text x="746" y="353" class="ui small" text-anchor="middle">管理</text><path d="M28 392H808" stroke="#D9CDBA"/></g><g><text x="28" y="428" class="ui body" font-weight="700">地图与资料署名</text><text x="28" y="454" class="ui small" fill="#8B8170">OSM / Wikidata / Weather source</text><rect x="690" y="410" width="112" height="38" rx="19" fill="#F3EDDF"/><text x="746" y="435" class="ui small" text-anchor="middle">查看</text><path d="M28 474H808" stroke="#D9CDBA"/></g><g><text x="28" y="510" class="ui body" font-weight="700">PWA</text><text x="28" y="536" class="ui small" fill="#8B8170">安装到桌面或手机主屏</text><rect x="690" y="492" width="112" height="38" rx="19" fill="#F3EDDF"/><text x="746" y="517" class="ui small" text-anchor="middle">可安装</text><path d="M28 556H808" stroke="#D9CDBA"/></g></g></svg>