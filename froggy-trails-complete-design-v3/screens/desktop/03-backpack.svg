<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<defs>
  <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9ED"/><stop offset="1" stop-color="#F0E4CF"/></linearGradient>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D8EEF1"/><stop offset="1" stop-color="#9FC8CF"/></linearGradient>
  <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B1D4D9"/><stop offset="1" stop-color="#6F9EAA"/></linearGradient>
  <pattern id="woodPattern" width="160" height="40" patternUnits="userSpaceOnUse"><rect width="160" height="40" fill="#654933"/><path d="M0 10 C40 3 72 16 160 8 M0 28 C48 19 98 34 160 26" stroke="#7A5941" stroke-width="2" opacity=".5" fill="none"/><path d="M22 0 C32 13 24 25 37 40 M112 0 C100 14 116 25 106 40" stroke="#463528" opacity=".35" fill="none"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D3A2E" flood-opacity=".13"/></filter>
  <filter id="shadowStrong" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#241A14" flood-opacity=".23"/></filter>
</defs>

<style>
.ui{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2D3A2E}
.serif{font-family:Georgia,"Songti SC","STSong",serif;fill:#2D3A2E}
.tiny{font-size:12px} .small{font-size:14px} .body{font-size:16px} .h2{font-size:20px;font-weight:700} .title{font-size:28px;font-weight:700} .hero{font-size:38px;font-weight:700}
</style>
<rect width="1440" height="960" fill="#F4EBD8"/><g id="top-nav"><rect width="1440" height="72" fill="#FFF9ED"/><path d="M0 71.5H1440" stroke="#D9CDBA"/><g transform="translate(42 18)"><path d="M0 18C6 4 19 3 25 16C15 15 8 21 0 18Z" fill="#5B7F3B"/><path d="M21 18C27 7 38 8 41 18C34 17 27 21 21 18Z" fill="#A7C66B"/><text x="52" y="22" class="ui title" font-size="24">蛙游记</text></g><text x="500" y="43" class="ui body" font-weight="700" fill="#5B7F3B">小屋</text><rect x="494" y="64" width="52" height="4" rx="2" fill="#5B7F3B"/><text x="596" y="43" class="ui body" font-weight="700" fill="#2D3A2E">旅行册</text><text x="700" y="43" class="ui body" font-weight="700" fill="#2D3A2E">地图</text><text x="786" y="43" class="ui body" font-weight="700" fill="#2D3A2E">商店</text><text x="1010" y="42" class="serif small" fill="#9A896F">把日子过成一场温柔的旅行</text><circle cx="1300" cy="35" r="17" fill="#E5E7D5"/><text x="1326" y="41" class="ui small">和小满一起看世界⌄</text></g><text x="72" y="132" class="serif title">准备行囊</text><text x="72" y="166" class="ui body" fill="#8B8170">行李会改变旅行倾向，但不会直接告诉你目的地。</text><g><rect x="72" y="200" width="420" height="650" rx="24" fill="url(#paperGrad)" stroke="#D9CDBA"/></g><g id="pack-frog" transform="translate(182 250) scale(1.55)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/><rect x="17" y="103" width="88" height="42" rx="12" fill="#C18A55" stroke="#6F5136" stroke-width="3"/><path d="M28 103Q62 78 94 103" fill="none" stroke="#6F5136" stroke-width="3"/></g><text x="150" y="484" class="serif h2">“我都准备好啦。”</text><rect x="112" y="530" width="340" height="92" rx="20" fill="#EEF0DF"/><text x="136" y="560" class="ui small" fill="#5B7F3B">行程倾向</text><text x="136" y="590" class="serif body">走得更远 · 偏凉爽 · 容易拍到风景</text><text x="136" y="616" class="ui small" fill="#8B8170">提示只表达方向，不显示概率。</text><g><rect x="522" y="200" width="846" height="650" rx="24" fill="url(#paperGrad)" stroke="#D9CDBA"/><text x="546" y="238" class="ui h2">四个行囊槽位</text></g><g><rect x="550" y="256" width="126" height="112" rx="20" fill="#EAF0DB" stroke="#5B7F3B"/><text x="613" y="311" text-anchor="middle" font-size="34">🥪</text><text x="613" y="344" text-anchor="middle" class="ui small">食物</text></g><g><rect x="720" y="256" width="126" height="112" rx="20" fill="#EAF0DB" stroke="#5B7F3B"/><text x="783" y="311" text-anchor="middle" font-size="34">☘</text><text x="783" y="344" text-anchor="middle" class="ui small">护符</text></g><g><rect x="890" y="256" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="953" y="311" text-anchor="middle" font-size="34">🧣</text><text x="953" y="344" text-anchor="middle" class="ui small">装备 A</text></g><g><rect x="1060" y="256" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="1123" y="311" text-anchor="middle" font-size="34">📷</text><text x="1123" y="344" text-anchor="middle" class="ui small">装备 B</text></g><text x="550" y="420" class="ui h2">背包里的东西</text><text x="1190" y="420" class="ui small" fill="#8B8170">12 件</text><g><rect x="550" y="452" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="613" y="507" text-anchor="middle" font-size="34">🥖</text><text x="613" y="540" text-anchor="middle" class="ui small">果酱面包</text></g><g><rect x="720" y="452" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="783" y="507" text-anchor="middle" font-size="34">🍙</text><text x="783" y="540" text-anchor="middle" class="ui small">饭团</text></g><g><rect x="890" y="452" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="953" y="507" text-anchor="middle" font-size="34">🥧</text><text x="953" y="540" text-anchor="middle" class="ui small">莓果挞</text></g><g><rect x="1060" y="452" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="1123" y="507" text-anchor="middle" font-size="34">🔔</text><text x="1123" y="540" text-anchor="middle" class="ui small">小铃铛</text></g><g><rect x="550" y="590" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="613" y="645" text-anchor="middle" font-size="34">🧴</text><text x="613" y="678" text-anchor="middle" class="ui small">水壶</text></g><g><rect x="720" y="590" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="783" y="645" text-anchor="middle" font-size="34">🧣</text><text x="783" y="678" text-anchor="middle" class="ui small">围巾</text></g><g><rect x="890" y="590" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="953" y="645" text-anchor="middle" font-size="34">⛺</text><text x="953" y="678" text-anchor="middle" class="ui small">帐篷</text></g><g><rect x="1060" y="590" width="126" height="112" rx="20" fill="#F6EEE0" stroke="#D9CDBA"/><text x="1123" y="645" text-anchor="middle" font-size="34">📷</text><text x="1123" y="678" text-anchor="middle" class="ui small">相机</text></g><g><rect x="1110" y="772" width="220" height="52" rx="18" fill="#5B7F3B" stroke="none"/><text x="1220.0" y="805" class="ui body" text-anchor="middle" fill="#FFF9ED" font-weight="700">确认行囊并等待出发</text></g></svg>