<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<defs>
  <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9ED"/><stop offset="1" stop-color="#F0E4CF"/></linearGradient>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D8EEF1"/><stop offset="1" stop-color="#9FC8CF"/></linearGradient>
  <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B1D4D9"/><stop offset="1" stop-color="#6F9EAA"/></linearGradient>
  <pattern id="woodPattern" width="160" height="40" patternUnits="userSpaceOnUse"><rect width="160" height="40" fill="#654933"/><path d="M0 10 C40 3 72 16 160 8 M0 28 C48 19 98 34 160 26" stroke="#7A5941" stroke-width="2" opacity=".5" fill="none"/><path d="M22 0 C32 13 24 25 37 40 M112 0 C100 14 116 25 106 40" stroke="#463528" opacity=".35" fill="none"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D3A2E" flood-opacity=".13"/></filter>
  <filter id="shadowStrong" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#241A14" flood-opacity=".23"/></filter>
</defs>

<style>
.ui{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2D3A2E}
.serif{font-family:Georgia,"Songti SC","STSong",serif;fill:#2D3A2E}
.tiny{font-size:12px} .small{font-size:14px} .body{font-size:16px} .h2{font-size:20px;font-weight:700} .title{font-size:28px;font-weight:700} .hero{font-size:38px;font-weight:700}
</style>
<rect width="390" height="844" fill="#F4EBD8"/><rect width="390" height="62" fill="#FFF9ED"/><text x="18" y="39" class="ui h2">旅行中</text><text x="330" y="39" class="ui small">☘328</text><text x="20" y="96" class="serif h2">小满正在旅行</text><text x="20" y="122" class="ui small" fill="#8B8170">不知道它去了哪里，只知道风有点大。</text><g transform="translate(14 150)" filter="url(#shadow)"><rect width="362" height="360" rx="26" fill="url(#skyGrad)"/><path d="M0 220Q80 182 166 208T362 190V360H0Z" fill="#99AD83"/><path d="M56 286C130 240 222 240 310 278" fill="none" stroke="#C96F4A" stroke-width="3" stroke-dasharray="8 8"/><g id="mt-frog" transform="translate(130 222) scale(0.8)"><ellipse cx="64" cy="131" rx="47" ry="10" fill="#2D3A2E" opacity=".13"/><rect x="88" y="76" width="32" height="41" rx="10" fill="#B77242" stroke="#6E4B34" stroke-width="3"/><ellipse cx="63" cy="86" rx="48" ry="45" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><ellipse cx="63" cy="98" rx="31" ry="27" fill="#E9E3A6"/><circle cx="38" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="88" cy="57" r="19" fill="#8FB65A" stroke="#4E7138" stroke-width="4"/><circle cx="40" cy="55" r="6" fill="#263628"/><circle cx="86" cy="55" r="6" fill="#263628"/><circle cx="42" cy="53" r="2" fill="white"/><circle cx="88" cy="53" r="2" fill="white"/><path d="M49 74Q63 83 77 74" fill="none" stroke="#3B5535" stroke-width="3" stroke-linecap="round"/><ellipse cx="29" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><ellipse cx="97" cy="78" rx="7" ry="4" fill="#D98375" opacity=".45"/><path d="M49 41L40 27M77 41L88 26" stroke="#C96F4A" stroke-width="5" stroke-linecap="round"/><path d="M16 102Q2 119 0 136M107 99Q126 115 128 133" stroke="#4E7138" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M124 84L139 136" stroke="#7D5D3F" stroke-width="4"/></g></g><g transform="translate(14 528)"><rect width="362" height="202" rx="26" fill="url(#paperGrad)"/><text x="22" y="40" class="ui h2">今天的旅行迹象</text><text x="22" y="76" class="serif body">风很大 · 没有下雨 · 路有点长</text><text x="22" y="116" class="ui small" fill="#8B8170">不展示倒计时，也不展示实时位置。</text><g><rect x="22" y="134" width="318" height="52" rx="18" fill="#FFF9ED" stroke="#D9CDBA"/><text x="181.0" y="167" class="ui body" text-anchor="middle" fill="#2D3A2E" font-weight="700">看看旧明信片</text></g></g><g transform="translate(0 770)"><rect width="390" height="74" fill="#FFF9ED"/><text x="28" y="34" class="ui small" fill="#5B7F3B">⌂ 小屋</text><text x="112" y="34" class="ui small" fill="#2D3A2E">▤ 旅行册</text><text x="220" y="34" class="ui small" fill="#2D3A2E">⌖ 地图</text><text x="310" y="34" class="ui small" fill="#2D3A2E">♧ 我的</text></g></svg>